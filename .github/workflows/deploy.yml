name: Build & deploy web app to GitHub Pages

# The Svelte/WASM web app lives under `wasm-port/`. Everything else in the
# repo (Python optimizer, NiceGUI inventory tool, etc.) is desktop-only and
# does not need to be built here. Two paths into this workflow:
#   * push to main (auto-deploy whatever's on main)
#   * manual run from the Actions tab (Workflow Dispatch)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Single-flight: don't queue stale Pages deploys, but let an in-flight one
# finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Python (build_data.py emits the static config/decks/modifiers
      # JSON the SPA reads at runtime). ─────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate static data bundle
        working-directory: wasm-port
        run: uv run python scripts/build_data.py

      # ── Rust → WASM (wasm-port's ndm_core is feature-gated; build the
      # browser variant only). ──────────────────────────────────────────
      - name: Set up Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-port/ndm_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm-port/ndm_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Build wasm crate (browser target)
        working-directory: wasm-port/ndm_core
        # The `--` separates wasm-pack flags from cargo flags so
        # `--no-default-features --features wasm` actually reaches cargo
        # (otherwise wasm-pack swallows them).
        run: wasm-pack build --target web --release --out-dir ../web/src/wasm -- --no-default-features --features wasm

      # ── Node / Vite (Svelte app). ────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wasm-port/web/package-lock.json

      - name: Install web deps
        working-directory: wasm-port/web
        run: npm ci

      - name: Build site
        working-directory: wasm-port/web
        # VITE_BASE matches the project-pages URL prefix `/<repo>/`.
        # Override via repo vars if you ever move to a custom domain or a
        # user-page (`<user>.github.io`).
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # ── Pages artifact ───────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm-port/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
