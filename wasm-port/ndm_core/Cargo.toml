[package]
name = "ndm_core"
version = "0.1.2"
edition = "2021"

[lib]
name = "ndm_core"
# `cdylib` for wasm-bindgen output; `rlib` so cargo check / tests can link.
crate-type = ["cdylib", "rlib"]

# This crate is web-only after the dedup refactor. The native CLI uses the
# OUTER ndm_core/ crate (PyO3). The `wasm` feature is kept as a feature flag
# so the existing build commands keep working unchanged.
[features]
default = ["wasm"]
wasm    = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen", "dep:getrandom"]

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }

wasm-bindgen        = { version = "0.2", optional = true }
serde               = { version = "1",   features = ["derive"], optional = true }
serde-wasm-bindgen  = { version = "0.6", optional = true }
# Without this `getrandom` feature, `rand::SmallRng::from_entropy` won't link
# on wasm32-unknown-unknown (no OS RNG by default).
getrandom = { version = "0.2", features = ["js"], optional = true }
